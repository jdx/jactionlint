[tools]
go = "1.27"
node = "lts"
hk = "latest"
pkl = "latest"
shellcheck = "latest"
uv = "latest"
"pipx:pyflakes" = "latest"
"go:honnef.co/go/tools/cmd/staticcheck" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"

[tasks.build]
description = "Build the actionlint executable"
run = "go build ./cmd/actionlint"

[tasks.test]
description = "Run all tests"
run = "go test ./..."

[tasks.lint]
description = "Run all checks (what CI runs): gofmt, vet, staticcheck, govulncheck, shellcheck, docs and workflow checks"
run = "hk check --all"

[tasks.lint-fix]
description = "Run all checks and fix what can be fixed"
run = "hk fix --all"
