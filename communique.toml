context = "jactionlint is a static checker for GitHub Actions workflow files, maintained as a fork of rhysd/actionlint. It validates workflow syntax, ${{ }} expressions, action inputs and outputs, reusable workflows, runner labels and security issues, and integrates shellcheck and pyflakes for run scripts."

system_extra = """
Do not include a 'Sponsor jactionlint' section, sponsorship blurb, or any funding callout in the generated notes. A sponsor section is appended by a separate CI step; emitting one here causes a duplicate.

Credit only people other than @jdx. @jdx maintains jactionlint and writes most changes, so never credit @jdx: no "(@jdx)", "by @jdx", or thanks to @jdx, and a bullet for a change he wrote alone ends with its PR link and no username. When someone else wrote a change, or is named in its description as a co-author or as the person who reported the problem, credit them by username, also on a bullet for a change @jdx wrote.
"""

[defaults]
emoji = false
