name: Release
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  binaries:
    # macOS runner: the darwin binaries are signed and notarized with Apple's tooling. Go cross-compiles every
    # other target from here too.
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - run: gem install ronn
      # Only the roff page is shipped. Generating the HTML page crashes with the current mustache gem
      # (undefined method `strip' for an instance of Array) so it is skipped with --roff.
      - run: ronn --roff ./man/jactionlint.1.ronn
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - name: Get version
        run: echo VERSION="${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASS }}
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          # Used by the codesign build hook (see .goreleaser.yaml)
          APPLE_SIGNING_IDENTITY: "Developer ID Application: Jeffrey Dickey (4993Y37DX6)"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used to push the Homebrew cask commit to the protected main branch (see .goreleaser.yaml)
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Signing settles who built the binary; notarization is what Gatekeeper demands once an archive carries the
      # quarantine bit, which is to say whenever someone downloads it in a browser or installs the Homebrew cask.
      # Without a ticket it is blocked behind a "cannot be verified" dialog that only a deliberate override gets past.
      #
      # The ticket lives on Apple's side and is keyed to the binary's cdhash, so nothing here rewrites what was
      # already built or uploaded -- stapling would, but `stapler` only writes into bundles, disk images, and
      # installer packages, and this is a bare Mach-O in an archive. Gatekeeper resolves the ticket online instead.
      - name: Notarize macOS binaries
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER_ID" ]; then
            echo "::error title=Notarization credentials missing::App Store Connect credentials are required for macOS releases."
            exit 1
          fi

          # Outside the workspace, so no later step can sweep the key into an artifact, and removed even when
          # notarization fails.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$work/key.p8"

          # notarytool takes a container, never a bare executable. Copies are fine: a Mach-O carries its signature
          # inline, so the cdhash the ticket is keyed to is the one already archived. Both arches share a name, so
          # each gets its own directory.
          mkdir "$work/stage"
          binaries=(dist/macos_darwin_*/jactionlint)
          for binary in "${binaries[@]}"; do
            mkdir "$work/stage/$(basename "$(dirname "$binary")")"
            cp "$binary" "$work/stage/$(basename "$(dirname "$binary")")/"
          done
          # Apple rejects a binary without the hardened runtime or a secure timestamp. Naming a missing one here
          # turns an opaque Invalid verdict into a diagnosis; Apple stays the authority on whether to accept.
          for binary in "${binaries[@]}"; do
            details="$(codesign --display --verbose=4 "$binary" 2>&1 || true)"
            case "$details" in
              *runtime*) ;;
              *) echo "::warning title=No hardened runtime::$binary is signed without --options runtime, which Apple requires; expect an Invalid verdict below." ;;
            esac
            case "$details" in
              *Timestamp=*) ;;
              *) echo "::warning title=No secure timestamp::$binary carries no secure timestamp, which Apple requires; expect an Invalid verdict below." ;;
            esac
          done

          ditto -c -k --norsrc --noextattr "$work/stage" "$work/submission.zip"

          # `--wait` is not a gate on its own: it can return zero on an Invalid submission, so the reported status
          # is what decides. plutil reads JSON and ships with macOS, which keeps this off jq.
          result="$(xcrun notarytool submit "$work/submission.zip" \
            --key "$work/key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --output-format json \
            --timeout 30m \
            --wait)"
          echo "$result"

          status="$(printf '%s' "$result" | plutil -extract status raw -o - -)"
          id="$(printf '%s' "$result" | plutil -extract id raw -o - -)"
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization returned $status for submission $id"
            xcrun notarytool log "$id" \
              --key "$work/key.p8" \
              --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" || true
            exit 1
          fi
          echo "notarized: submission $id"
      # Sign a packslip (https://packslip.dev) for the archives and upload the bundle (packslip.sigstore.json) to the
      # draft release. This lets mise install jactionlint with the packslip backend. Releases are immutable once
      # published so this has to happen before the release is published below.
      - uses: jdx/packslip@v1
        with:
          artifacts: dist/jactionlint_*.tar.gz dist/jactionlint_*.zip
          bin: jactionlint
      # GoReleaser leaves the release as a draft (see .goreleaser.yaml) so that every asset, including the packslip
      # bundle, is on it before it is published. Published releases are immutable. This is idempotent.
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ format('./dist/jactionlint_{0}_checksums.txt', env.VERSION) }}
      - name: Post-release download check
        run: bash ./scripts/download-jactionlint.bash "$VERSION"
      - name: Clone nested repository to make version bump commit
        uses: actions/checkout@v6
        with:
          path: ./tmp-jactionlint-for-update-ver
          ref: main
          fetch-depth: 0
          # main is protected: pushing the version bump commit needs the PAT, GITHUB_TOKEN cannot bypass it
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Update version in download script
        run: |
          set -x
          cd ./tmp-jactionlint-for-update-ver
          # -i.bak works with both GNU and BSD sed (this runs on macOS)
          sed -i.bak -E "s/version=\"[0-9]+\\.[0-9]+\\.[0-9]+\"/version=\"${VERSION}\"/" ./scripts/download-jactionlint.bash
          rm ./scripts/download-jactionlint.bash.bak
          git diff
          git add ./scripts/download-jactionlint.bash
          git -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c user.name='github-actions[bot]' commit -m "update version to $VERSION in download-jactionlint.bash"
          git log -n 1
          git push
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Get tag name
        id: tag
        run: |
          echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            GOLANG_VER=1.27
            JACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          tags: |
            ghcr.io/jdx/jactionlint:${{ steps.tag.outputs.name }}
            ghcr.io/jdx/jactionlint:latest
  # Release notes can still be edited after the release is published (assets and the tag cannot).
  enhance-release:
    name: Enhance release notes
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          mise_toml: |
            [tools]
            communique = "latest"
      - run: communique generate "$TAG" --github-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Append sponsor blurb
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          body=$(gh release view "$TAG" --json body --jq .body)
          if grep -qiE '^##.*Sponsor jdx.s jactionlint' <<<"$body"; then
            echo "Sponsor section already present in $TAG release notes; skipping append."
            exit 0
          fi
          {
            printf '%s\n' "$body"
            cat <<'EOF'

          ## 💚 Sponsor jactionlint

          jactionlint is a fork of [rhysd/actionlint](https://github.com/rhysd/actionlint), maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.

          If jactionlint has a place in your development workflow, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep jactionlint fast, free, and independent.
          EOF
          } > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"

  comment-release-fixes:
    needs: binaries
    if: ${{ !cancelled() && needs.binaries.result == 'success' }}
    permissions:
      contents: read
      pull-requests: read
      issues: write
      discussions: write
    uses: jdx/workflows/.github/workflows/comment-release-fixes.yml@4c952564543dd54d60f15ef4062af7fb60c5561d # v1.1.0
    with:
      tag: ${{ github.ref_name }}
      marker_prefix: jactionlint-fixed-in
