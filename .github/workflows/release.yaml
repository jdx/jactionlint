name: Release
on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'
      # ronn is installed by name on purpose: scripts/build-man.bash does the same for `mise run man`
      - run: gem install ronn # jactionlint ignore=adhoc-packages
      # Only the roff page is shipped. Generating the HTML page crashes with the current mustache gem
      # (undefined method `strip' for an instance of Array) so it is skipped with --roff.
      - run: ronn --roff ./man/jactionlint.1.ronn
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
          check-latest: true
          # The workflow runs on pushed tags and publishes the binaries: nothing restored from a cache may end up in them
          cache: false
      - name: Get version
        run: echo VERSION="${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Used to push the Homebrew cask commit to the protected main branch (see .goreleaser.yaml)
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
      # Sign a packslip (https://packslip.dev) for the archives and upload the bundle (packslip.sigstore.json) to the
      # draft release. This lets mise install jactionlint with the packslip backend. Releases are immutable once
      # published so this has to happen before the release is published below.
      - uses: jdx/packslip@2af36e792faa28130987c8af509e475c7458405d # v1.6.0
        with:
          artifacts: dist/jactionlint_*.tar.gz dist/jactionlint_*.zip
          bin: jactionlint
      # GoReleaser leaves the release as a draft (see .goreleaser.yaml) so that every asset, including the packslip
      # bundle, is on it before it is published. Published releases are immutable. This is idempotent.
      - name: Publish the release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ${{ format('./dist/jactionlint_{0}_checksums.txt', env.VERSION) }}
      - name: Post-release download check
        run: bash ./scripts/download-jactionlint.bash "$VERSION"
      - name: Clone nested repository to make version bump commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: ./tmp-jactionlint-for-update-ver
          ref: main
          fetch-depth: 0
          # main is protected: pushing the version bump commit needs the PAT, GITHUB_TOKEN cannot bypass it
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Update version in download script
        run: |
          set -x
          cd ./tmp-jactionlint-for-update-ver
          sed -i -E "s/version=\"[0-9]+\\.[0-9]+\\.[0-9]+\"/version=\"${VERSION}\"/" ./scripts/download-jactionlint.bash
          git diff
          git add ./scripts/download-jactionlint.bash
          git -c user.email='41898282+github-actions[bot]@users.noreply.github.com' -c user.name='github-actions[bot]' commit -m "update version to $VERSION in download-jactionlint.bash"
          git log -n 1
          git push
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Get tag name
        id: tag
        run: |
          echo "name=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64
          build-args: |
            GOLANG_VER=1.27
            JACTIONLINT_VER=${{ steps.tag.outputs.name }}
          push: true
          tags: |
            ghcr.io/jdx/jactionlint:${{ steps.tag.outputs.name }}
            ghcr.io/jdx/jactionlint:latest
  # Release notes can still be edited after the release is published (assets and the tag cannot).
  enhance-release:
    name: Enhance release notes
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          mise_toml: |
            [tools]
            communique = "latest"
      - run: communique generate "$TAG" --github-release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Append sponsor blurb
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          body=$(gh release view "$TAG" --json body --jq .body)
          if grep -qiE '^##.*Sponsor jdx.s jactionlint' <<<"$body"; then
            echo "Sponsor section already present in $TAG release notes; skipping append."
            exit 0
          fi
          {
            printf '%s\n' "$body"
            cat <<'EOF'

          ## 💚 Sponsor jactionlint

          jactionlint is a fork of [rhysd/actionlint](https://github.com/rhysd/actionlint), maintained by [@jdx](https://github.com/jdx), an open source developer at [**entire.io**](https://entire.io/), the title sponsor of his open source work.

          If jactionlint has a place in your development workflow, please consider becoming an [individual or company sponsor](https://jdx.dev/sponsors.html). Your support funds ongoing development and helps keep jactionlint fast, free, and independent.
          EOF
          } > "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
