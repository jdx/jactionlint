name: Release Please

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'jdx' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Opens/updates the release PR from conventional commits. Merging it tags
      # vX.Y.Z and creates a DRAFT GitHub release (see release-please-config.json). The tag push triggers
      # release.yaml, which uploads the assets to the draft and publishes it. Releases are immutable once
      # published so assets can only be uploaded while it is a draft.
      # A PAT is required: tags pushed with GITHUB_TOKEN do not trigger workflows.
      - name: Run release-please
        id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
