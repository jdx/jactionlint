name: Generate
on:
  push:
    paths:
      - 'scripts/generate-popular-actions/main.go'
      - 'scripts/generate-popular-actions/popular_actions.json'
      - 'scripts/generate-webhook-events/main.go'
    branches:
      - main
    tags-ignore:
      - '*'
  schedule:
    # Every Saturday 10:21 in JST
    - cron: '21 1 * * 6'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  go-generate:
    if: ${{ github.repository == 'jdx/jactionlint' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27'
          check-latest: true
      # Detecting new major versions of popular actions must never stop the data refresh: they are added to
      # the registry (known tags, and "next" is advanced) and listed in the pull request body for review.
      - name: Check new releases on GitHub
        run: |
          set -o pipefail
          go run ./scripts/generate-popular-actions -d -w -r scripts/generate-popular-actions/popular_actions.json | tee "$RUNNER_TEMP/detect.txt"
      - run: go generate
      - name: Check changes
        id: diff
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff
          {
            echo 'This PR updates the generated files to the latest by running go generate.'
            echo
            echo 'Output of the detection of new releases of popular actions (generate-popular-actions -d -w):'
            echo
            echo '```'
            cat "$RUNNER_TEMP/detect.txt"
            echo '```'
            echo
            echo "This PR was created by [this workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) automatically."
            echo "List of workflow runs is [here]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/generate.yaml)."
          } > "$RUNNER_TEMP/pr-body.md"
          echo "pr=true" >> "$GITHUB_OUTPUT"
      # A PAT is required: pull requests opened with GITHUB_TOKEN do not trigger the CI workflows, so their
      # required checks would never run. The same token is used by release-please.yaml.
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
          branch: ci/generate
          delete-branch: true
          commit-message: 'chore(generate): update generated files by `go generate`'
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          title: 'chore(generate): update generated files by `go generate`'
          body-path: ${{ runner.temp }}/pr-body.md
          assignees: jdx
        if: ${{ steps.diff.outputs.pr == 'true' }}
