name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Saturday 6:41 in JST
    - cron: '41 21 * * 5'
  workflow_dispatch:

permissions:
  security-events: write

jobs:
  analyze-go:
    name: Analyze Go
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yaml
          languages: go
      - name: Build Go sources
        run: |
          set -x
          go build -v ./cmd/jactionlint
          GOOS=js GOARCH=wasm go build -v -o ./docs/public/playground/main.wasm ./playground
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
  analyze-ts:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          config-file: ./.github/codeql/codeql-config.yaml
          languages: javascript-typescript
          source-root: ./docs
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
