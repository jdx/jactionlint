name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - name: Restore Go modules
        id: go-mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}
          restore-keys: go-mod-${{ runner.os }}-${{ runner.arch }}-
      - name: Download Go modules
        run: go mod download
      - name: Save Go modules
        if: steps.go-mod-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.go-mod-cache.outputs.cache-primary-key }}
      - name: Restore Go build and test cache
        id: go-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/go-build' || runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
          key: go-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-${{ hashFiles('**/*.go') }}
          restore-keys: |
            go-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('go.mod', 'go.sum', 'mise.toml') }}-
      - parallel:
          - name: Test Go packages with race detector
            if: matrix.os == 'ubuntu-latest' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
            run: go test -race ./...
          # On main the same run goes through jouet so its timing is recorded.
          - name: Test Go packages with race detector and jouet
            if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
            run: JOUET_TEST_BASELINE=off jouet test --display human --cmd -- go test -race ./...
          - name: Test Go packages
            if: matrix.os == 'macos-latest'
            run: go test ./...
          - name: Test Go packages (Windows)
            if: matrix.os == 'windows-latest'
            shell: pwsh
            run: pwsh -NoProfile -File ./scripts/ci/test-windows.ps1
          - name: Check upstream pins
            run: mise run upstream:check
          - name: Test upstream manager
            run: mise run upstream:test
          - name: Build without cgo
            run: go build ./cmd/jactionlint
            env:
              # Note: -race requires cgo
              CGO_ENABLED: 0
          - name: Build with race instrumentation
            run: go build -race -o jactionlint-race ./cmd/jactionlint
      - name: Bundle test timings from jouet
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: git bundle create "$RUNNER_TEMP/cost-${{ github.job }}-${{ strategy.job-index }}.bundle" refs/notes/jouet-cost || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: jouet-cost-${{ github.job }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/cost-${{ github.job }}-${{ strategy.job-index }}.bundle
          if-no-files-found: ignore
      - name: Save Go build and test cache
        if: always() && steps.go-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/go-build' || runner.os == 'macOS' && '~/Library/Caches/go-build' || '~/.cache/go-build' }}
          key: ${{ steps.go-build-cache.outputs.cache-primary-key }}
      - name: Dog fooding 🐶
        run: |
          echo "::add-matcher::.github/jactionlint-matcher.json"
          ./jactionlint --color
  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Builds main.wasm, then runs the playground tests against it (the permalinks in docs/checks.md etc.)
      - name: Test playground
        run: mise run docs:test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      - run: hk check --all
  docker:
    name: Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            GOLANG_VER=1.27
          push: false
      - name: Test Docker image
        run: docker container run
          --mount type=bind,source="$(pwd)",target=/mnt/app
          --workdir /mnt/app
          -- ${{ steps.image.outputs.digest }} --color --verbose
      - name: Lint Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint --ignore DL3018 --ignore DL3066 --strict-labels - < Dockerfile

  # Aggregator that required-status-checks can target. If any upstream job
  # failed or was skipped, this job exits non-zero so the PR is blocked. Lets
  # the branch-protection rule depend on one name instead of the whole matrix.
  # Pushes the timings that the Ubuntu unit-tests job recorded on main. It is its
  # own job so the jobs that run pull request code never hold a write token, and
  # nothing waits on it.
  jouet-cost:
    name: jouet-cost
    needs: [unit-tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false # the token reaches only the push step
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: jouet
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: jouet-cost-*
          merge-multiple: true
          path: jouet-cost-bundles
      - name: Merge and push the timings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader "GIT_CONFIG_VALUE_0=AUTHORIZATION: basic $auth"
          for b in jouet-cost-bundles/*.bundle; do
            [ -e "$b" ] || continue
            jouet cost fetch "./$b"
          done
          jouet cost push

  final:
    name: final
    needs: [unit-tests, wasm, lint, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    # Run on success or upstream failure but skip when the workflow is
    # cancelled; `always()` would override cancel-in-progress.
    if: ${{ !cancelled() }}
    steps:
      - name: Gate on upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = False
          for name, data in sorted(needs.items()):
              result = data.get("result", "unknown")
              print(f"{name}: {result}")
              if result != "success":
                  failed = True
          sys.exit(1 if failed else 0)
          PY
