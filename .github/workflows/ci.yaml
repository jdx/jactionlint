name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install dependencies on macOS
        run: |
          set -x
          brew install --quiet shellcheck python3 pipx
          # https://pipx.pypa.io/stable/installation/
          pipx ensurepath
          pipx install pyflakes
          shellcheck --version
          pyflakes --version
        if: ${{ runner.os == 'macOS' }}
      - name: Install dependencies on Linux
        run: |
          set -x
          sudo apt-get install -y shellcheck
          pip install pyflakes
          shellcheck --version
          pyflakes --version
        if: ${{ runner.os == 'Linux' }}
      - name: Install dependencies on Windows
        run: |
          winget install --id koalaman.shellcheck --disable-interactivity --accept-package-agreements --accept-source-agreements
          pip install pyflakes
          pyflakes --version
        if: ${{ runner.os == 'Windows' && matrix.os != 'windows-11-arm' }}
      - name: Install dependencies on Windows ARM
        # winget is not available on the Windows ARM runner image
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'shellcheck'
          Invoke-WebRequest -Uri 'https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.zip' -OutFile "$dir.zip"
          Expand-Archive -Path "$dir.zip" -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
          & "$dir\shellcheck.exe" --version
          pip install pyflakes
          pyflakes --version
        if: ${{ matrix.os == 'windows-11-arm' }}
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - run: go test -v -race ./...
      # Check build without CGO
      - run: go build ./cmd/actionlint
        env:
          # Note: -race requires cgo
          CGO_ENABLED: 0
      # Set -race for catching data races on dog fooding (#333)
      - run: go build -race ./cmd/actionlint
      - name: Dog fooding 🐶
        run: |
          echo "::add-matcher::.github/actionlint-matcher.json"
          ./actionlint -color
  wasm:
    name: Wasm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./playground
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: ./playground/package-lock.json
      - name: Build playground
        run: make build
      - name: Lint playground
        run: npm run lint
      - name: Run tests for wasm
        run: npm test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          check-latest: true
      - name: Install dependencies
        run: |
          sudo apt-get install -y shellcheck
          pip install pyflakes
          shellcheck --version
          pyflakes --version
      - name: Check Go sources are formatted
        run: |
          diffs="$(gofmt -d ./*.go ./cmd/actionlint/*.go ./scripts/*/*.go ./playground/*.go)"
          if [[ "$diffs" != "" ]]; then
            echo "$diffs" >&2
            exit 1
          fi
      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: make lint SKIP_GO_GENERATE=true
      - name: Lint bash scripts
        run: shellcheck ./scripts/*.bash ./playground/*.bash
  docker:
    name: Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        id: image
        uses: docker/build-push-action@v7
        with:
          build-args: |
            GOLANG_VER=1.27
          push: false
      - name: Test Docker image
        run: docker container run
          --mount type=bind,source="$(pwd)",target=/mnt/app
          --workdir /mnt/app
          -- ${{ steps.image.outputs.digest }} -color -verbose
      - name: Lint Dockerfile with hadolint
        run: docker run --rm -i hadolint/hadolint hadolint --ignore DL3018 --ignore DL3066 --strict-labels - < Dockerfile

  # Aggregator that required-status-checks can target. If any upstream job
  # failed or was skipped, this job exits non-zero so the PR is blocked. Lets
  # the branch-protection rule depend on one name instead of the whole matrix.
  final:
    name: final
    needs: [unit-tests, wasm, lint, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    # Run on success or upstream failure but skip when the workflow is
    # cancelled; `always()` would override cancel-in-progress.
    if: ${{ !cancelled() }}
    steps:
      - name: Gate on upstream job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          failed = False
          for name, data in sorted(needs.items()):
              result = data.get("result", "unknown")
              print(f"{name}: {result}")
              if result != "success":
                  failed = True
          sys.exit(1 if failed else 0)
          PY
