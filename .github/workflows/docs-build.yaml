name: Docs
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'playground/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - 'scripts/build-wasm.bash'
      - '.github/workflows/docs-build.yaml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'playground/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - 'scripts/build-wasm.bash'
      - '.github/workflows/docs-build.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for the "last updated" dates
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Builds the playground wasm too. VitePress fails the build on dead links
      - run: mise run docs:build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: mise run docs:test
