name: Pages
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'playground/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'
      - 'scripts/build-wasm.bash'
      - '.github/workflows/pages.yaml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for the "last updated" dates
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      # Builds the playground wasm, installs the npm dependencies and runs `vitepress build`
      - run: mise run docs:build
        env:
          # For the GitHub star count in the nav bar (the build works without it)
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/.vitepress/dist
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: ${{ github.repository_owner == 'jdx' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
