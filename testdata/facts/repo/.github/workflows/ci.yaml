name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: [self-hosted, "${{ matrix.os }}"]
    timeout-minutes: ${{ fromJSON(vars.TIMEOUT) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'push' }}
          version: "20"
      - run: make test
        shell: bash
  release:
    needs: test
    if: github.ref_type == 'tag'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yaml
    with:
      channel: stable
    secrets: inherit
