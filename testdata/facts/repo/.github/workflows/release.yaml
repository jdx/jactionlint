name: Release
on:
  workflow_call:
    inputs:
      channel:
        type: string
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567
      - run: ./publish.sh
