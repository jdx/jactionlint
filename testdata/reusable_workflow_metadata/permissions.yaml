name: with permissions

on:
  workflow_call:

permissions:
  contents: read

jobs:
  inherits:
    runs-on: ubuntu-latest
    steps:
      - run: echo inherits
  override:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - run: echo override
  empty:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - run: echo empty
  all-read:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - run: echo read-all
  anchor:
    runs-on: ubuntu-latest
    permissions: &anchored
      contents: write
    steps:
      - run: echo anchor
  alias:
    runs-on: ubuntu-latest
    permissions: *anchored
    steps:
      - run: echo alias
