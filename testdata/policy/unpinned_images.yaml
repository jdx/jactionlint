on: push

jobs:
  container:
    runs-on: ubuntu-latest
    container: node
    steps:
      - run: echo hello
  latest:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/owner/image:latest
    steps:
      - run: echo hello
  tag:
    runs-on: ubuntu-latest
    container:
      image: node:20
    services:
      db:
        image: postgres:16-alpine
      cache:
        image: redis
      pinned:
        image: postgres:16@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      broken:
        image: postgres@sha256:abc
      dynamic:
        image: ${{ vars.IMAGE }}
      registry-port:
        image: localhost:5000/team/image
    steps:
      - run: echo hello
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ["debian:12", "alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"]
        include:
          - image: ubuntu
          - image: ${{ vars.OTHER }}
        other: [x]
    container: ${{ matrix.image }}
    steps:
      - run: echo hello
  expression-with-a-tail:
    runs-on: ubuntu-latest
    container: ${{ vars.IMAGE }}-bookworm
    services:
      tool:
        image: ${{ vars.REGISTRY }}/tool:1.2
      digest-in-the-text:
        image: ${{ vars.REGISTRY }}/tool@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      digest-from-expression:
        image: tool@sha256:${{ vars.DIGEST }}
      value-from-expression:
        image: ${{ vars.REGISTRY }}/${{ vars.TOOL }}
    steps:
      - run: echo hello
  matrix-with-keys:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        leg:
          - name: a
            image: debian:12
          - name: b
            image: alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    container: ${{ matrix.leg.image }}
    steps:
      - run: echo hello
  matrix-in-the-tag:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ["15", "16"]
    services:
      db:
        image: postgres:${{ matrix.postgres }}
    steps:
      - run: echo hello
  matrix-in-the-tag-unknown:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        postgres: ${{ fromJSON(vars.VERSIONS) }}
    services:
      db:
        image: postgres:${{ matrix.postgres }}
    steps:
      - run: echo hello
