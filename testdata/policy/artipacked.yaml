on: push

jobs:
  no-with:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo hello
  with-other-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # a comment
        with:
          # all history for the changelog
          fetch-depth: 0
          submodules: true
      - uses: actions/upload-artifact@v4
        with:
          path: .
  pushes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git commit -am update
          git push
  flow:
    runs-on: ubuntu-latest
    steps:
      - {uses: actions/checkout@v4}
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
  ok:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          persist-credentials: ${{ vars.PERSIST }}
      - uses: actions/checkout@v4
        with:
          repository: owner/other
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: x
          key: y
  pushes-and-uploads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git push
      - uses: actions/upload-artifact@v4
        with:
          path: .
  mentions-push-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Commits go through GraphQL rather than `git push`
          echo "to publish by hand run: git push origin main"
          printf '%s\n' "git push --force is not used here"
  pushes-through-a-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: retry 3 git push origin HEAD
  pushes-in-bash-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -c "git push origin HEAD"
  pushes-with-pwsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: pwsh
        run: git push origin HEAD
