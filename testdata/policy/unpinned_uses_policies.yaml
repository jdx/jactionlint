on: push

jobs:
  steps:
    runs-on: ubuntu-latest
    steps:
      # hash-pin: the most specific pattern is actions/checkout
      - uses: actions/checkout@v4
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # ref-pin: actions/*
      - uses: actions/setup-node@v4
      - uses: actions/cache/restore@main
      # any: trusted-org/*
      - uses: trusted-org/tool@main
      # hash-pin again: the most specific pattern is trusted-org/strict/sub
      - uses: trusted-org/strict/sub/dir@v1
      - uses: trusted-org/strict/other@v1
      # no pattern matches: hash-pin
      - uses: owner/repo@v1
      - uses: owner/repo/path@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      # docker images follow the "*" pattern, which is not set here, so they are hash-pinned
      - uses: docker://alpine
      - uses: docker://alpine:latest
      - uses: docker://alpine:3.20
      - uses: docker://alpine@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      # local paths are never reported
      - uses: ./local
  call:
    uses: actions/some-repo/.github/workflows/x.yml@v1
  call-other:
    uses: owner/repo/.github/workflows/x.yml@v1
