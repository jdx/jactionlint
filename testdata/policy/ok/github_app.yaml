on: push

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}
          permission-issues: write
          skip-token-revoke: ${{ vars.SKIP }}
      - run: echo hello
