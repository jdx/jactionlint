name: pr-only
description: Used by one pull_request_target workflow only
inputs:
  title:
    description: title
    default: ''
runs:
  using: composite
  steps:
    - run: echo "skipping dependabot"
      if: github.actor == 'dependabot[bot]'
      shell: bash
    - run: echo ${{ inputs.title }} ${{ github.event.pull_request.title }}
      shell: bash
