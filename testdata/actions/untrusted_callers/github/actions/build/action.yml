name: build
description: Checks out a ref and builds it
inputs:
  ref:
    description: The ref to build
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ inputs.ref }}
    - run: make test
      shell: bash
