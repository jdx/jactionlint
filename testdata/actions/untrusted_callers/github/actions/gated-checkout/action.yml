name: gated-checkout
description: Checks out a ref and then checks the permission of the user
inputs:
  ref:
    description: The ref to check out
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ inputs.ref }}
    - uses: sushichop/action-repository-permission@v3
      with:
        required-permission: write
