version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown: # a comment
      default-days: 14
      semver-major-days: 30
  - {package-ecosystem: cargo, directory: "/", schedule: {interval: weekly}, cooldown: {default-days: 10}}
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      "default-days": 7
