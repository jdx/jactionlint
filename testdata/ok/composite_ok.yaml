name: Setup
description: A composite action without problems
inputs:
  version:
    description: Version to install
    required: true
outputs:
  path:
    description: Install path
    value: ${{ steps.install.outputs.path }}
runs:
  using: composite
  steps:
    - id: install
      env:
        VERSION: ${{ inputs.version }}
      run: echo "path=/opt/tool-$VERSION" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: /opt
        key: tool-${{ inputs.version }}
