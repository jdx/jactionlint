version: 2
registries:
  python:
    type: python-index
    url: https://pypi.example.com/simple
    username: octocat
    password: ${{secrets.PYPI_PASSWORD}}
  cargo:
    type: cargo-registry
    url: sparse+https://cargo.example.com/index/
    token: ${{ secrets.CARGO_TOKEN }}
  npm:
    type: npm-registry
    url: https://user@npm.example.com
    token: ${{secrets.NPM_TOKEN}}
    replaces-base: true
  azure:
    type: docker-registry
    url: https://example.azurecr.io
    tenant-id: 00000000-0000-0000-0000-000000000000
    client-id: 00000000-0000-0000-0000-000000000001
  hex-repo:
    type: hex-repository
    repo: example
    url: https://hex.example.com
    auth-key: ${{secrets.HEX_AUTH_KEY}}
    public-key-fingerprint: 0123456789abcdef
  url-without-password:
    type: maven-repository
    url: https://octocat:${{secrets.MAVEN_PASSWORD}}@maven.example.com/releases
    username: octocat
    password: ${{secrets.MAVEN_PASSWORD}}
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    registries:
      - npm
