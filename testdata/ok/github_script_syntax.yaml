on:
  workflow_dispatch:
    inputs:
      script:
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # await and return at the top level, a template literal, a regular expression, spreads and an arrow function
      - id: a
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.list({ ...context.repo, state: 'open' })
            const titles = data.map(p => `#${p.number}: ${p.title}`).filter(t => /^#\d+/.test(t))
            core.setOutput('titles', titles.join('\n'))
            if (titles.length === 0) {
              return null
            }
            return titles // a comment at the end without a newline
      # octokit is not an argument of v7, so the name is free here (it is one in v8)
      - uses: actions/github-script@v7
        with:
          script: |
            const octokit = github
            const getOctokit = () => octokit
            return getOctokit()
      # The expressions are replaced: in a string, as a value and as a name
      - uses: actions/github-script@v7
        with:
          script: |
            const ref = '${{ github.ref }}'
            const n = ${{ github.run_number }} + 1
            const o = { ${{ github.actor }}: 1 }
            console.log(ref, n, o)
      # A commit does not name the version: only the arguments that every version has are taken, the others are free
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const exec = require('child_process').exec
            const glob = 1
            exec('ls')
      # A script that comes from an expression is not looked at
      - uses: actions/github-script@v7
        with:
          script: ${{ inputs.script }}
      # An expression that touches a number or a name could continue it, whatever the value is: not looked at
      - uses: actions/github-script@v7
        with:
          script: |
            const n = 1${{ inputs.script }};
            const m = ${{ inputs.script }}x;
            const k = ;
      # The end of an expression with }} in a string depends on it: not looked at
      - uses: actions/github-script@v7
        with:
          script: |
            const n = ${{ format('{0}{{}}', 1) }};
            const k = ;
      # An expression on several lines is not looked at
      - uses: actions/github-script@v7
        with:
          script: |
            const v = ${{
              github.run_number
            }}
            console.log(v)
      # Other actions with a script input are not JavaScript of github-script
      - uses: amadevus/pwsh-script@v2
        with:
          script: |
            Write-Output "hello" +* 1
      - uses: actions/github-script-extra@v1
        with:
          script: this is (not
