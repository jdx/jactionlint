# Concurrency settings which the rules about cancelled runs accept
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  # The ref is refs/pull/<number>/merge for pull requests and the tag for tags. Only pushes to main
  # are cancelled by other pushes to main, and the idiom below does not cancel those.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    concurrency:
      group: test-${{ github.head_ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - run: echo test
  docs:
    runs-on: ubuntu-24.04
    # Deploys never cancel each other
    environment: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - run: echo deploy
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - run: cargo publish --dry-run
