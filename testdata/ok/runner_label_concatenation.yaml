on:
  workflow_dispatch:
    inputs:
      os:
        type: string
      matrix:
        type: string
      suffix:
        type: string

jobs:
  # Every label that the values make is a label
  valid:
    strategy:
      matrix:
        os: [ubuntu, windows, macos]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - run: echo ...
  # The only job of the value which is not a label is removed by exclude
  excluded:
    strategy:
      matrix:
        os: [ubuntu, linux]
        exclude:
          - os: linux
    runs-on: ${{ matrix.os }}-latest
    steps:
      - run: echo ...
  # An exclude with an expression can remove any value
  excluded-by-expression:
    strategy:
      matrix:
        os: [ubuntu, linux]
        exclude:
          - os: ${{ inputs.os }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - run: echo ...
  # A number which GitHub prints as it is written makes a label, another one is not resolved
  numbers:
    strategy:
      matrix:
        # GitHub prints 20.10 as 20.1, and the other forms of numbers are not resolved
        version: [22.04, 20.10, 0x18]
    runs-on: ubuntu-${{ matrix.version }}
    steps:
      - run: echo ...
  # Values that are not strings or that are expressions are not resolved
  dynamic:
    strategy:
      matrix:
        os: [ubuntu, '${{ inputs.os }}', {a: b}, [c]]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - run: echo ...
  from-json:
    strategy:
      matrix: ${{ fromJSON(inputs.matrix) }}
    runs-on: ${{ matrix.os }}-latest
    steps:
      - run: echo ...
  # More than one matrix value or another context in the label: the pairs that run are not known
  two-values:
    strategy:
      matrix:
        os: [ubuntu, linux]
        arch: [x64]
        exclude:
          - os: linux
            arch: x64
    runs-on: ${{ matrix.os }}-${{ matrix.arch }}
    steps:
      - run: echo ...
  other-context:
    strategy:
      matrix:
        os: [linux]
    runs-on: ${{ matrix.os }}-${{ inputs.suffix }}
    steps:
      - run: echo ...
  # A label of a self-hosted runner is chosen by its owner
  self-hosted:
    strategy:
      matrix:
        os: [linux, custom]
    runs-on: [self-hosted, '${{ matrix.os }}-gpu']
    steps:
      - run: echo ...
