on: push
jobs:
  # aube runs no script of a dependency that allowBuilds and its built-in list do not allow, and waits a day for a release
  defaults:
    runs-on: ubuntu-latest
    steps:
      - run: aube install
      - run: aube add left-pad
      - run: aube add left-pad@1.3.0
      - run: aube ci
      - run: aube install --frozen-lockfile
  # the project opted out of the allow list
  allow-all:
    runs-on: ubuntu-latest
    steps:
      - run: aube install --dangerously-allow-all-builds
      - run: aube add --dangerously-allow-all-builds left-pad
      - run: AUBE_DANGEROUSLY_ALLOW_ALL_BUILDS=1 aube install
      - run: aube ci --dangerously-allow-all-builds
      - run: aube install --dangerously-allow-all-builds --ignore-scripts
      - run: aube install --dangerously-allow-all-builds=false
  allow-all-env:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
    steps:
      - run: aube install
      - run: aube install --ignore-scripts
  allow-all-script:
    runs-on: ubuntu-latest
    steps:
      - run: aube install
      - run: aube config set dangerouslyAllowAllBuilds true
      - run: aube install
  # the project turned the release age off
  age-off:
    runs-on: ubuntu-latest
    env:
      AUBE_MINIMUM_RELEASE_AGE: 0
    steps:
      - run: aube add left-pad
      - run: aube ci
  age-on:
    runs-on: ubuntu-latest
    env:
      AUBE_MINIMUM_RELEASE_AGE: 4320
    steps:
      - run: aube add left-pad
  age-script:
    runs-on: ubuntu-latest
    steps:
      - run: aube add left-pad
      - run: aube config set minimumReleaseAge 0
      - run: aube add left-pad
