version: 2
updates:
  # ERROR: no cooldown
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # ERROR: cooldown without default-days
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      semver-major-days: 30
  # ERROR: default-days is too small
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
  # ERROR: zero days
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 0
  # OK
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # OK
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
      semver-patch-days: 1
