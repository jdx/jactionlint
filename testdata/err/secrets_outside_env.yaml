on: push
jobs:
  no-env:
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
        env:
          API_KEY: ${{ secrets.API_KEY }}
          COVERAGE: ${{ secrets.CI_COVERAGE_TOKEN }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
  with-env:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: ./deploy.sh
        env:
          API_KEY: ${{ secrets.API_KEY }}
