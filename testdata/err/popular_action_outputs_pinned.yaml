on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # actions/cache sets cache-hit output
      - uses: actions/cache@v4.2.4
        id: tag
        with:
          key: x
          path: p
      # OK
      - run: echo ${{ steps.tag.outputs.cache-hit }}
      # ERROR: Typo at output name
      - run: echo ${{ steps.tag.outputs.cache_hit }}
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        id: sha
        with:
          key: x
          path: p
      # OK: the outputs of an action pinned to a commit are not checked: nothing verifies the version comment
      - run: echo ${{ steps.sha.outputs.cache_hit }}
