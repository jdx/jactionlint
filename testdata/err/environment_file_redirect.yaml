on: push
jobs:
  bare-words:
    runs-on: ubuntu-latest
    steps:
      - id: a
        run: echo "version=1.2.3 é" >> GITHUB_OUTPUT
      - run: echo "FOO=bar" > GITHUB_ENV
      - run: echo "/opt/bin" >> "GITHUB_PATH"
      - run: echo "# summary" | tee -a GITHUB_STEP_SUMMARY
      - run: echo "token=x" >> 'GITHUB_STATE'
      - run: |
          {
            echo "a=1"
            echo "b=2"
          } >> GITHUB_OUTPUT
      - run: |
          if [ -n "$X" ]; then
            echo "a=1" >> GITHUB_OUTPUT
          fi
  truncation:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "a=1" >> "$GITHUB_OUTPUT"
          echo "b=2" > "$GITHUB_OUTPUT"
      - run: |
          echo "A=1" >> $GITHUB_ENV
          echo "B=2" | tee $GITHUB_ENV
      - run: |
          echo "a=1" >> "$GITHUB_OUTPUT"
          if [ -n "$X" ]; then
            echo "b=2" > "$GITHUB_OUTPUT"
          fi
  not-reported:
    runs-on: ubuntu-latest
    steps:
      - run: echo "a=1" >> "$GITHUB_OUTPUT"
      - run: echo "a=1" > "$GITHUB_OUTPUT"
      - run: |
          echo "a=1" >> "$GITHUB_OUTPUT"
          echo "b=2" >> "$GITHUB_OUTPUT"
          echo "c=3" | tee -a "$GITHUB_OUTPUT"
      - run: |
          echo "a=1" > "$GITHUB_OUTPUT"
          echo "b=2" >> "$GITHUB_OUTPUT"
      - run: |
          if [ -n "$X" ]; then
            echo "a=1" >> "$GITHUB_OUTPUT"
          else
            echo "b=2" > "$GITHUB_OUTPUT"
          fi
      - run: echo "a=1" >> GITHUB_OUTPUT.txt
  powershell:
    runs-on: windows-latest
    steps:
      - run: echo "a=1" >> $env:GITHUB_OUTPUT
      - shell: cmd
        run: echo a=1 >> %GITHUB_OUTPUT%
