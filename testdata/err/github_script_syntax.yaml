on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # A syntax error in a literal block: the position is the one in the file
      - uses: actions/github-script@v7
        with:
          script: |
            const issue = context.issue
            const body = await github.rest.issues.get({
              ...issue,
              state: ,
            })
            return body.data
      # The script is the body of a function: a name of an argument cannot be declared again (exec is one since v4)
      - uses: actions/github-script@v7
        with:
          script: |
            const exec = require('child_process').exec
            exec('ls')
      # octokit is an argument since v8 (it is free in v7), so this declaration is an error only here
      - uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo
            let octokit = 1
      # A script that does not end (the error is reported at the script), and a plain scalar on one line
      - uses: actions/github-script@v7
        with:
          script: if (context.payload.pull_request) {
      # The expressions are replaced by names of the same length before the check, so they are not the error
      - uses: actions/github-script@v7
        with:
          script: |
            const title = '${{ github.run_id }}'
            const n = ${{ github.run_number }}
            console.log(title n)
      # A quoted scalar with an escape and non-ASCII text before the error
      - uses: actions/github-script@v7
        with:
          script: "const s = 'héllo wörld'\nconst t = s +* 1"
