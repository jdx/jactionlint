on:
  issue_comment:
    types: [created]

jobs:
  # ERROR: the environment has no required reviewers, so nobody approves the run
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          prompt: Answer the comment
  # ERROR: the job it needs is no gate either
  after-staging:
    runs-on: ubuntu-latest
    needs: staging
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          prompt: Answer the comment
  # OK: the reviewers of the environment decide
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          prompt: Answer the comment
