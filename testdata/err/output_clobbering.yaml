# A comment can hold a line break: the second line becomes another record of the file
on:
  issue_comment:
    types: [created]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      approved: ${{ steps.record.outputs.approved }}
    steps:
      - id: record
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
      - id: delimiter
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "approved=false" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - id: heredoc
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          cat <<EOF >> "$GITHUB_OUTPUT"
          approved=false
          body=$BODY
          EOF
      # Not reported: one line, a delimiter that nobody can guess, a validated value
      - id: title
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
      - id: random
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          delimiter=$(uuidgen)
          {
            echo "body<<$delimiter"
            echo "$BODY"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          echo "approved=false" >> "$GITHUB_OUTPUT"
      - id: validated
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          [[ "$BODY" =~ ^[0-9]+$ ]] || exit 1
          echo "number=$BODY" >> "$GITHUB_OUTPUT"
          echo "approved=false" >> "$GITHUB_OUTPUT"
      - id: counted
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "lines=$(echo "$BODY" | wc -l)" >> "$GITHUB_OUTPUT"
          echo "approved=false" >> "$GITHUB_OUTPUT"
      - id: whole
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "$BODY" | head -n 1 >> "$GITHUB_OUTPUT"
      - id: printfconstant
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          printf 'body<<%s\n%s\n%s\n' EOF "$BODY" EOF >> "$GITHUB_OUTPUT"
      - id: splitclosed
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          d=$(uuidgen)
          printf 'title<<%s\n' "$d" >> "$GITHUB_OUTPUT"
          echo "fixed" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$d" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
      - id: splitopen
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          d=$(uuidgen)
          printf 'body<<%s\n' "$d" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$d" >> "$GITHUB_OUTPUT"
      - id: closeandrecord
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          d=$(uuidgen)
          printf 'title<<%s\n' "$d" >> "$GITHUB_OUTPUT"
          echo "fixed" >> "$GITHUB_OUTPUT"
          printf '%s\nbody=%s\n' "$d" "$BODY" >> "$GITHUB_OUTPUT"
      - id: closeandconstant
        run: |
          d=$(uuidgen)
          printf 'title<<%s\n' "$d" >> "$GITHUB_OUTPUT"
          echo "fixed" >> "$GITHUB_OUTPUT"
          printf '%s\nbody=%s\n' "$d" "fixed" >> "$GITHUB_OUTPUT"
      - id: wholeset
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "$BODY" | tr -cd 'a-z0-9' >> "$GITHUB_OUTPUT"
      - id: printfrandom
        env:
          BODY: ${{ github.event.comment.body }}
          DELIM: ${{ secrets.DELIM }}
        run: |
          d=$DELIM
          printf 'body<<%s\n%s\n%s\n' "$d" "$BODY" "$d" >> "$GITHUB_OUTPUT"
          echo "approved=false" >> "$GITHUB_OUTPUT"
      # Not reported: the step has no id, so nothing reads its outputs
      - env:
          BODY: ${{ github.event.comment.body }}
        run: |
          echo "approved=false" >> "$GITHUB_OUTPUT"
          echo "body=$BODY" >> "$GITHUB_OUTPUT"
      - if: steps.record.outputs.approved == 'true' || steps.delimiter.outputs.approved == 'true' || steps.heredoc.outputs.approved == 'true' || steps.whole.outputs.approved == 'true' || steps.printfconstant.outputs.approved == 'true' || steps.splitclosed.outputs.approved == 'true' || steps.closeandrecord.outputs.approved == 'true'
        run: echo approved
      - if: steps.title.outputs.approved == 'true' || steps.random.outputs.approved == 'true' || steps.validated.outputs.approved == 'true' || steps.counted.outputs.approved == 'true' || steps.wholeset.outputs.approved == 'true' || steps.printfrandom.outputs.approved == 'true' || steps.splitopen.outputs.approved == 'true' || steps.closeandconstant.outputs.approved == 'true'
        run: echo approved
