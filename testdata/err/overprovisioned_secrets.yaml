on: push
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [ONE, TWO]
    steps:
      - run: ./deploy.sh
        env:
          ALL: ${{ toJSON(secrets) }}
          DYNAMIC: ${{ secrets[matrix.name] }}
          EACH: ${{ secrets.ONE }}
          LITERAL: ${{ secrets['TWO'] }}
