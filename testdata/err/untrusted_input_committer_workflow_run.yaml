name: Test
on:
  push:
  workflow_run:
    workflows: [CI]
    types: [completed]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo ${{ github.event.head_commit.committer.name }}
      - run: echo ${{ github.event.commits[0].committer.email }}
      - run: echo ${{ github.event.workflow_run.display_title }}
      - run: echo ${{ github.event.workflow_run.head_commit.message }}
      - run: echo ${{ github.event.workflow_run.pull_requests[0].head.ref }}
      - run: echo ${{ github.event.pull_request.head.repo.description }}
      - run: echo ${{ github.event.workflow_run.head_commit.id }}
