on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ERROR: the token of the registry is in the cache, which other workflows restore
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.npmrc
          key: npm
      # ERROR: the config of the checkout keeps its token
      - uses: actions/cache/save@v4
        with:
          path: .git
          key: repo
      # ERROR: the keys of the cloud tools
      - uses: actions/cache@v4
        with:
          path: |
            ~/.aws/credentials
            ~/.aws/config
          key: aws
      # OK: not a file with credentials
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.ssh/known_hosts
            .docker
          key: other
