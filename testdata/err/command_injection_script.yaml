on:
  issues:
    types: [opened]
permissions: {}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        with:
          script: |
            const { execSync, execFileSync } = require('child_process');
            execSync(`git log --grep ${process.env.TITLE}`);
            const title = context.payload.issue.title;
            execSync('echo ' + title);
            await exec.exec(process.env.TITLE);
            // Not reported: the value is an argument or was checked
            execFileSync('git', ['log', '--grep', process.env.TITLE]);
            await exec.exec('git', ['log', '--grep', process.env.TITLE]);
            execSync('echo "$TITLE"', { env: { TITLE: process.env.TITLE } });
            execSync(`echo ${process.env.REPO}`);
            execSync(`echo ${Number(process.env.TITLE)}`);
