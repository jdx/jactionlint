on:
  workflow_run:
    workflows: [CI]
    types: [completed]

jobs:
  # ERROR: the environment has no required reviewers, so nobody approves the run
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
  # OK: the reviewers of the environment decide
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
  # ERROR: no environment
  plain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
