version: 2
registries:
  # ERROR: a password written in plain text
  dockerhub:
    type: docker-registry
    url: https://registry.hub.docker.com
    username: octocat
    password: not-a-real-password
  # ERROR: a token written in plain text
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: "not-a-real-token"
  # ERROR: a key written in plain text
  hex-org:
    type: hex-organization
    organization: example
    key: not-a-real-key
  # ERROR: an auth-key written in plain text
  hex-repo:
    type: hex-repository
    repo: example
    url: https://hex.example.com
    auth-key: not-a-real-auth-key
    public-key-fingerprint: 0123456789abcdef
  # ERROR: a password in the URL
  maven:
    type: maven-repository
    url: https://octocat:not-a-real-password@maven.example.com/releases
    username: octocat
    password: ${{secrets.MAVEN_PASSWORD}}
  # OK: references to Dependabot secrets
  python:
    type: python-index
    url: https://pypi.example.com/simple
    username: octocat
    password: ${{secrets.PYPI_PASSWORD}}
  cargo:
    type: cargo-registry
    url: sparse+https://cargo.example.com/index/
    token: ${{ secrets.CARGO_TOKEN }}
  # OK: OIDC needs no secret
  azure:
    type: nuget-feed
    url: https://pkgs.example.com/nuget/v3/index.json
    tenant-id: 00000000-0000-0000-0000-000000000000
    client-id: 00000000-0000-0000-0000-000000000001
  # OK: a username is not a secret, a URL without credentials
  composer:
    type: composer-repository
    url: https://user@composer.example.com
    username: octocat
    password: ${{secrets.COMPOSER_PASSWORD}}
    replaces-base: true
updates:
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    registries:
      - dockerhub
