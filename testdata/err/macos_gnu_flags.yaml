on: push

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - run: echo hi | tee --append out.txt
      - run: sed -i 's/a/b/' file.txt
      - run: sed -Ei 's/a+/b/' file.txt
      - run: sed --in-place 's/a/b/' file.txt
      - run: date -d '2 days ago' +%F
      - run: grep -oP 'v\K[0-9.]+' version.txt
      - run: git ls-files | grep --perl-regexp '^src/'
      - run: stat -c %s file.txt
      - run: find . -name '*.go' -printf '%p\n'
      - run: cp --parents src/a.go dist/
      - run: |
          set -eu
          sed -i "s/$OLD/$NEW/" config.yml
          cat config.yml | tee --append log.txt
      # The value of the option is glued to it, and other options come before
      - run: date -d@1700000000 +%F
      - run: stat -c%s file.txt
      - run: cp -f --parents src/a.go dist/
  xcode:
    runs-on: xcode-27
    steps:
      - run: date -d yesterday
  matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - run: date -d yesterday
  words-that-are-not-the-system:
    runs-on: macos-latest
    steps:
      # MY_OSTYPE_FILE is not $OSTYPE, and the left side of && has no fallback
      - run: |
          echo "${MY_OSTYPE_FILE:-none}"
          sed -i 's/a/b/' file.txt
      - run: date -d yesterday && echo done
      - run: grep -P x file && echo found
  macos-excluded-and-included:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        exclude:
          - os: macos-latest
        include:
          - os: macos-latest
            extra: yes
    runs-on: ${{ matrix.os }}
    steps:
      - run: date -d yesterday
  job-with-condition:
    # the condition cannot read the runner or the matrix, so the job runs on macOS whenever it runs
    if: github.event_name == 'push'
    runs-on: macos-15
    steps:
      - run: date -d yesterday
  quoted-options:
    runs-on: macos-latest
    steps:
      - run: sed "-i" 's/a/b/' file.txt
      - run: date '-d' yesterday
      - run: grep "-P" x file
      - run: stat "-c" %s file
      - run: grep '-e' -P file && grep -P x file2 && true
  attached-empty-suffix:
    runs-on: macos-latest
    steps:
      # The shell removes the quotes, so this is sed -i and the script is the suffix
      - run: sed -i'' 's/a/b/' file.txt
      - run: sed -i"" 's/a/b/' file.txt
  self-hosted-leg:
    # The matrix chooses the whole runner: one job is self-hosted and another is GitHub-hosted macOS
    strategy:
      matrix:
        os: [self-hosted, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: date -d yesterday
  end-of-options:
    runs-on: macos-latest
    steps:
      # The option comes before --
      - run: grep -P -- x file.txt
      - run: find -- . -name '*.go' -printf '%p\n'
  portable-looking-file-names:
    runs-on: macos-latest
    steps:
      # What follows -- is a file name that looks like an option of macOS: it does not make the GNU option portable
      - run: |
          date -- -j
          date -d yesterday
      - run: |
          tee -- -a
          echo x | tee --append out.txt
