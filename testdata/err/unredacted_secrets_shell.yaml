on: push
env:
  CREDS: ${{ secrets.CREDENTIALS }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # A value cut from a secret and printed
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$KEY"
      - run: |
          PASSWORD=$(echo "$CREDS" | jq -r .password)
          printf '%s\n' "$PASSWORD"
      - run: |
          TOKEN=$(echo '${{ secrets.CREDENTIALS }}' | cut -d: -f2)
          cat <<<"$TOKEN"
      - run: |
          PREFIXED=${CREDS#prefix-}
          echo "token is $PREFIXED"
      - run: |
          echo "user: $(jq -r .user <<<"$CREDS")"
      # A copy of a derived value is derived
      - run: |
          A=$(jq -r .a <<<"$CREDS")
          B="$A"
          echo "$B"
      # set -x shows the value
      - run: |
          set -x
          KEY=$(jq -r .private_key <<<"$CREDS")
          ./deploy "$KEY"
      - run: |
          set -euxo pipefail
          KEY=$(jq -r .private_key <<<"$CREDS")
      # Masked first
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY"
          echo "$KEY"
      # Not printed
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$KEY" | base64 -d > key.pem
          echo "key=$KEY" >> "$GITHUB_ENV"
          echo "$KEY" > key.txt
          { echo "$KEY"; } > key2.txt
          curl -H "Authorization: Bearer $KEY" https://example.com
          ./deploy --key "$KEY"
      - run: |
          set -x
          set +x
          KEY=$(jq -r .private_key <<<"$CREDS")
          ./deploy "$KEY"
      # Not a cut of the secret: the exact value is masked
      - run: |
          COPY="$CREDS"
          echo "$COPY"
          echo "$CREDS"
          LOGIN="user:$CREDS"
          echo "$LOGIN"
          DEFAULTED=${CREDS:-none}
          echo "$DEFAULTED"
      # Not derived from a secret
      - run: |
          NAME=$(jq -r .name package.json)
          echo "$NAME"
      # A value that a service or a hash returns
      - run: |
          SESSION=$(curl -s -H "Authorization: Bearer $CREDS" https://example.com/session)
          echo "$SESSION"
          DIGEST=$(sha256sum <<<"$CREDS")
          echo "$DIGEST"
      # set -x shows a substitution in any command
      - run: |
          set -x
          ./deploy "$(jq -r .private_key <<<"$CREDS")"
      # A step that sets the name again replaces the secret of the workflow
      - run: |
          KEY=$(jq -r .a <<<"$CREDS")
          echo "$KEY"
        env:
          CREDS: not a secret
      # A substring from the start of the value
      - run: |
          PREFIX=${CREDS::8}
          echo "$PREFIX"
      # An appended value is still the cut value
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          KEY+=-suffix
          echo "$KEY"
      # A command substitution runs in a subshell: its assignments are not the script's
      - run: |
          OUT=$(KEY=$(jq -r .private_key <<<"$CREDS"); echo done)
          echo "$KEY"
      # A secret written as an expression in a heredoc
      - run: |
          A=$(cut -d: -f1 <<EOF
          ${{ secrets.CREDENTIALS }}
          EOF
          )
          echo "$A"
      # A substitution inside a substitution
      - run: |
          A=$(jq -r .a <<<"$(echo "$CREDS")")
          echo "$A"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$(echo "$KEY")"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$(curl -s -H "Authorization: $KEY" https://example.com)"
      # set -x shows a copy and an appended value
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          set -x
          COPY="$KEY"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          set -x
          KEY+=-suffix
      # printf -v assigns a variable and prints nothing
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          printf -v OUT '%s' "$KEY"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          printf -v OUT '%s' "$KEY"
          echo "$OUT"
      # A cut of a cut, through a heredoc
      - run: |
          A=$(jq -r .a <<<"$CREDS")
          B=$(cut -d: -f1 <<EOF
          $A
          EOF
          )
          echo "$B"
      # A substitution in a here-string is a subshell: what it prints is its input, its assignments stay inside
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          jq . <<<"$(echo "$KEY")" > /dev/null
      - run: |
          cat <<<"$(OTHER=$(jq -r .a <<<"$CREDS"); true)" > /dev/null
          echo "$OTHER"
      # A mask that does not reach the log does not mask
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY" > mask.txt
          echo "$KEY"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY" | wc -c
          echo "$KEY"
      # A command in the heredoc of a substitution is not its last command
      - run: |
          A=$(jq -r .a <<EOF
          $(echo "$CREDS")
          EOF
          )
          echo "$A"
      # The value goes on through a pipe to cat
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$KEY" | cat
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$KEY" | cat > key.txt
          echo "$KEY" | wc -c
      # A process substitution is the name of a file, and not supported: nothing is reported
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo <(echo "$KEY")
      # An update in place still holds the secret
      - run: |
          CREDS=$(jq -r .a <<<"$CREDS")
          echo "$CREDS"
      - run: |
          CREDS=${CREDS#prefix}
          echo "$CREDS"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          KEY=$(cut -d: -f1 <<<"$KEY")
          echo "$KEY"
      # A cut value that is only passed on by printf is still cut
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          COPY=$(printf '%s' "$KEY")
          echo "$COPY"
      # set -x shows the commands inside a substitution too, with a ++
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          set -x
          jq . <<<"$(echo "$KEY")" > /dev/null
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          set -x
          SESSION=$(curl -s -H "Authorization: $KEY" https://example.com)
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          set +x
          SESSION=$(curl -s -H "Authorization: $KEY" https://example.com)
      # A heredoc values an expansion as a word: a cut of a masked value is a cut, a masked value is silent
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY"
          cat <<EOF
          ${KEY:0:8}
          EOF
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY"
          cat <<EOF
          $KEY
          EOF
      # -v is the option of printf only as the first argument
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          printf '%s %s %s\n' -v OUT "$KEY"
      # A mask is exactly the whole value of one variable: more text, a cut, or more arguments mask another string
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY extra"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::${KEY:0:4}"
          echo "$KEY"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY" "$KEY"
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          printf '::add-mask::%s\n' "$KEY"
          echo "$KEY"
