on: push
env:
  CREDS: ${{ secrets.CREDENTIALS }}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # A value cut from a secret and printed
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$KEY"
      - run: |
          PASSWORD=$(echo "$CREDS" | jq -r .password)
          printf '%s\n' "$PASSWORD"
      - run: |
          TOKEN=$(echo '${{ secrets.CREDENTIALS }}' | cut -d: -f2)
          cat <<<"$TOKEN"
      - run: |
          PREFIXED=${CREDS#prefix-}
          echo "token is $PREFIXED"
      - run: |
          echo "user: $(jq -r .user <<<"$CREDS")"
      # A copy of a derived value is derived
      - run: |
          A=$(jq -r .a <<<"$CREDS")
          B="$A"
          echo "$B"
      # set -x shows the value
      - run: |
          set -x
          KEY=$(jq -r .private_key <<<"$CREDS")
          ./deploy "$KEY"
      - run: |
          set -euxo pipefail
          KEY=$(jq -r .private_key <<<"$CREDS")
      # Masked first
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "::add-mask::$KEY"
          echo "$KEY"
      # Not printed
      - run: |
          KEY=$(jq -r .private_key <<<"$CREDS")
          echo "$KEY" | base64 -d > key.pem
          echo "key=$KEY" >> "$GITHUB_ENV"
          echo "$KEY" > key.txt
          { echo "$KEY"; } > key2.txt
          curl -H "Authorization: Bearer $KEY" https://example.com
          ./deploy --key "$KEY"
      - run: |
          set -x
          set +x
          KEY=$(jq -r .private_key <<<"$CREDS")
          ./deploy "$KEY"
      # Not a cut of the secret: the exact value is masked
      - run: |
          COPY="$CREDS"
          echo "$COPY"
          echo "$CREDS"
          LOGIN="user:$CREDS"
          echo "$LOGIN"
          DEFAULTED=${CREDS:-none}
          echo "$DEFAULTED"
      # Not derived from a secret
      - run: |
          NAME=$(jq -r .name package.json)
          echo "$NAME"
      # A value that a service or a hash returns
      - run: |
          SESSION=$(curl -s -H "Authorization: Bearer $CREDS" https://example.com/session)
          echo "$SESSION"
          DIGEST=$(sha256sum <<<"$CREDS")
          echo "$DIGEST"
