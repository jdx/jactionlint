on: push

jobs:
  # ERROR: the value under secrets: is passed to the called workflow
  passed:
    uses: octo/repo/.github/workflows/w.yaml@v1
    with:
      note: ${{ secrets.NOT_PASSED }}
    secrets:
      token: ${{ secrets.DEPLOY_TOKEN }}
  # OK: nothing is passed with secrets: inherit, and a secret in another field is not a secret that is passed
  inherited:
    uses: octo/repo/.github/workflows/w.yaml@v1
    with:
      note: ${{ secrets.NOT_PASSED }}
    secrets: inherit
  # OK: the token is bound by the permissions of the workflow
  token:
    uses: octo/repo/.github/workflows/w.yaml@v1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
