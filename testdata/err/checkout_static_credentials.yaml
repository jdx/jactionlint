on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}
      - uses: actions/checkout@v4
        with:
          token: ghp_0123456789abcdef
      # Not reported
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ALLOWED_TOKEN }}
      - uses: actions/checkout@v4
