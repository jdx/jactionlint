on: push
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: ./deploy.sh
        env:
          USERNAME: ${{ fromJSON(secrets.CREDENTIALS).username }}
          PASSWORD: ${{ fromJSON(secrets.CREDENTIALS)['password'] }}
          WHOLE: ${{ fromJSON(secrets.CREDENTIALS) }}
          SEPARATE: ${{ secrets.CREDENTIALS_PASSWORD }}
          PLAIN: ${{ fromJSON(github.event.head_commit.message).name }}
