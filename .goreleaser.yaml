version: 2

release:
  # release-please creates the release as a draft (and the tag). Releases are immutable once published, so every
  # asset must be uploaded to that draft first. GoReleaser uploads the archives and leaves it a draft so that the
  # packslip bundle can be added too. release.yaml publishes it afterwards.
  use_existing_draft: true
  draft: true
  prerelease: false
  # A failed run leaves the archives on the draft. Replace them when the workflow is re-run instead of failing on
  # the "asset already exists" error. This only works while the release is a draft (published ones are immutable).
  replace_existing_artifacts: true

before:
  hooks:
    - go mod download

builds:
  - <<: &build_defaults
      main: ./cmd/jactionlint
      ldflags: -s -w -X github.com/jdx/jactionlint.version={{.Version}} -X "github.com/jdx/jactionlint.installedFrom=installed by downloading from release page"
      env:
        - CGO_ENABLED=0
    id: macos
    goos: [darwin]
    goarch: [amd64, arm64]

  - <<: *build_defaults
    id: linux
    goos: [linux]
    goarch: [386, arm, amd64, arm64]

  - <<: *build_defaults
    id: windows
    goos: [windows]
    goarch: [386, amd64, arm64]

  - <<: *build_defaults
    id: freebsd
    goos: [freebsd]
    goarch: [386, amd64]

checksum:
  name_template: "jactionlint_{{.Version}}_checksums.txt"
  algorithm: sha256

archives:
  - <<: &archives_defaults
      files:
        - README.md
        - LICENSE.txt
        - docs
        - man/jactionlint.1
    id: nix
    ids: [macos, linux, freebsd]
    formats: [tar.gz]
  - <<: *archives_defaults
    id: windows
    ids: [windows]
    formats: [zip]

homebrew_casks:
  - name: jactionlint
    directory: Casks
    binaries: [jactionlint]
    manpages: [man/jactionlint.1]
    homepage: https://github.com/jdx/jactionlint#readme
    description: Static checker for GitHub Actions workflow files
    dependencies:
      - formula: shellcheck
    repository:
      owner: jdx
      name: jactionlint
      # The cask is committed to the protected main branch, which GITHUB_TOKEN cannot bypass
      token: "{{ .Env.RELEASE_PLZ_TOKEN }}"
    commit_author:
      name: 'github-actions[bot]'
      email: '41898282+github-actions[bot]@users.noreply.github.com'

changelog:
  disable: true
